name: CI

on:
  push:
    branches: [main]
    paths:
      - 'tpms/**'
      - 'docs/**'
      - 'README.md'
      - 'README_EN.md'
      - 'BENCHMARKS.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tpms/**'
      - 'docs/**'
      - 'README.md'
      - 'README_EN.md'
      - 'BENCHMARKS.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 同 ref 新提交直接取消旧 run，省 runner 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · 46 gates
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tpms/tpms-platform/package-lock.json

      - name: Install dependencies
        working-directory: tpms/tpms-platform
        run: npm ci

      # playwright 浏览器缓存（~ 在 cache action 内可靠展开；Windows 的 %LocalAppData% 不做变量展开，故分两步）
      - name: Cache playwright browsers (linux/mac)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.61.1-${{ runner.os }}

      - name: Cache playwright browsers (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-1.61.1-${{ runner.os }}

      # UI 门禁依赖 playwright（本地装在 tpms/.verify/node_modules，gitignored 不随仓库走）
      # --no-save + --no-package-lock：不动 package-lock（防 @emnapi/* optional 条目被改写，历史教训）
      - name: Install playwright (UI gates)
        working-directory: tpms/.verify
        run: npm install --no-save --no-package-lock playwright@1.61.1

      # hybrid_audit / custom_equation_audit 的代码生成对拍脚本 import numpy
      # 必须用 python3 -m pip：与门禁非 win 平台 spawn 的 python3 同解释器
      #（--break-system-packages 兜底 ubuntu-24.04 的 PEP 668 外部托管限制）
      # 注：numpy 走系统 python3 + pip，非 setup-python，暂不加 pip 缓存（改动收益低、平台差异风险高）
      - name: Install numpy (codegen gates)
        run: python3 -m pip install numpy || python3 -m pip install --break-system-packages numpy

      - name: Type check
        working-directory: tpms/tpms-platform
        run: npx tsc --noEmit

      # type check 已由前步承担，这里只跑 vite 构建（package.json 的 build 脚本保持 tsc && vite build 不动）
      - name: Build
        working-directory: tpms/tpms-platform
        run: npx vite build

      # 【2026-10-02 审查 H-1 结构缺口收口】Pages 部署的是 commit 进仓库的 docs/platform，
      # 而下方 46 门测的是 runner 内重建副本——两者此前无强约束：忘 commit 重建产物 = CI 全绿
      # + 线上陈旧。此步在替换前对拍重建产物与 commit 产物（排除 .map），不一致即红。
      - name: Deployed-artifact parity (docs/platform vs rebuilt dist)
        run: |
          set +e
          diff -r -w --strip-trailing-cr -q --exclude='*.map' tpms/tpms-platform/dist docs/platform > /tmp/parity_diff.txt 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo '::error::docs/platform 与源码重建产物不一致——Pages 正在部署陈旧产物。'
            echo '本地修复: cd tpms/tpms-platform && npx vite build && cd ../.. && rm -rf docs/platform && cp -r tpms/tpms-platform/dist docs/platform && find docs/platform -name "*.map" -delete'
            head -n 30 /tmp/parity_diff.txt
            exit 1
          fi
          echo 'docs/platform 与重建产物一致'

      - name: Deploy docs/platform (CI-local copy)
        run: |
          rm -rf docs/platform
          cp -r tpms/tpms-platform/dist docs/platform
          find docs/platform -name "*.map" -delete || true

      # windows runner 上 verify 套件六红五且失败点随机漂移（run48-53）——分层探针拿铁证：
      # A=服务器裸并发 B=浏览器全链路，一次 run 区分服务器层/浏览器层/长时序三种根因
      - name: Static server layer diagnosis (windows flake)
        if: runner.os == 'Windows'
        working-directory: tpms/.verify
        run: node diag_server_windows.mjs ../../docs/platform

      # 弃用 `| tee`：GH bash 自带 -e -o pipefail，长输出下 tee 偶发 EPIPE 会让全绿套件
      # 被判 exit 1（2026-09-24~28 连续四天随机平台假红实录，macOS #216 日志 45/45 全绿
      # 但步骤 exit 1 实锤）。输出直落文件 + 完整日志进 artifact + 尾部内联展示。
      - name: Run 46-gate suite
        working-directory: tpms/tpms-platform
        run: |
          set +e
          npm run test:all > "ci_gates_${{ matrix.os }}.log" 2>&1
          code=$?
          set -e
          tail -n 60 "ci_gates_${{ matrix.os }}.log"
          exit $code

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.os }}
          path: |
            tpms/tpms-platform/ci_gates_${{ matrix.os }}.log
          if-no-files-found: ignore
          retention-days: 7
